name: Laravel Integration

on:
  push:
    branches: [develop, main, master]
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Create Laravel application
        run: composer create-project laravel/laravel app --no-interaction --prefer-dist
      - name: Install package from checkout
        run: |
          cd app
          composer config repositories.translator path ../
          composer require mavisland/laravel-translator:@dev --no-interaction
      - name: Verify artisan commands
        run: |
          cd app
          php artisan translator:update
          php artisan translator:unused
